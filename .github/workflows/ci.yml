name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar la sintaxis de los servicios Node.js
        run: |
          for servicio in api-bff ms-usuarios ms-incidencias ms-proveedores ms-finanzas; do
            echo "Verificando $servicio"
            (cd services/$servicio && npm install --no-audit --no-fund && npm test)
          done

      - name: Verificar la sintaxis de ms-comunicaciones (Python)
        run: python -m py_compile services/ms-comunicaciones/app.py

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Construir las imagenes
        run: docker compose build

      - name: Levantar el entorno y probar los endpoints
        run: |
          docker compose up -d --wait
          ./scripts/probar.sh

      - name: Registros de los servicios (solo si algo fallo)
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el entorno
        if: always()
        run: docker compose down -v
